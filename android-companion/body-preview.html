<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RPM · Body preview</title>
<script type="importmap">{"imports": {"node:crypto": "data:text/javascript,export const randomUUID = () => crypto.randomUUID();"}}</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="planner.css">
<link rel="stylesheet" href="body.css">
<style>
  @font-face { font-family: "Google Sans Flex"; src: url('assets/fonts/google-sans-flex.woff2') format('woff2'); font-weight: 100 1000; font-display: block; }
  @font-face { font-family: "Material Symbols Rounded"; src: url('assets/fonts/material-symbols-rounded.woff2') format('woff2'); font-weight: 400; font-display: block; }
  body { display: flex; flex-direction: column; }
  #planner { flex: 1; min-height: 0; height: auto; }
  .preview-bar {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 6px;
    padding: 6px 8px;
    background: var(--surface-container-highest);
    color: var(--on-surface);
    font: 500 12px/16px var(--font);
  }
  .preview-bar button, .preview-bar select {
    min-height: 32px;
    padding-inline: 10px;
    border: 1px solid var(--outline);
    border-radius: var(--shape-sm);
    background: var(--surface);
    font: inherit;
  }
  .preview-bar button[aria-pressed=true] { background: var(--secondary-container); color: var(--on-secondary-container); border-color: var(--secondary-container); }
  .preview-bar button:active, .preview-bar select:active { background: var(--row-press); }
  .preview-group { display: inline-flex; align-items: center; gap: 4px; }
  .preview-samples { display: flex; flex-wrap: wrap; gap: 4px 8px; flex-basis: 100%; }
  .preview-samples[hidden] { display: none; }
  .preview-samples label { display: inline-flex; align-items: center; gap: 4px; }
</style>
<script type="module" src="body-preview.mjs"></script>
</head>
<body>
  <div class="preview-bar" role="toolbar" aria-label="Preview controls" id="preview-bar"></div>
  <main id="planner" data-view="today">
    <header id="top-bar" class="top-bar"></header>
    <div id="planner-scroll">
      <section id="workspace" aria-label="Plan"><div class="page"></div></section>
    </div>
    <nav id="nav-bar" aria-label="Planning"></nav>
  </main>
  <section id="sheet" hidden role="dialog" aria-modal="true" aria-label="Sheet"></section>
  <div id="snackbar" role="status" aria-live="polite" hidden></div>
</body>
</html>
