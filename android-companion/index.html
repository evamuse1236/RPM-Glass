<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>RPM · Capture</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/capture.css">
<script type="module" src="/runtime.js"></script>
</head>
<body>
<main class="host">
<section id="panel" class="panel" aria-label="RPM Capture" data-view="chat" data-busy="false" data-state="idle">
  <div class="grab" aria-hidden="true"></div>
  <header class="panel-header">
    <button id="back" class="icon-btn" type="button" aria-label="Back" hidden><span class="ms" aria-hidden="true">arrow_back</span></button>
    <span class="brand" aria-hidden="true"><span class="ms">edit_note</span></span>
    <h1 id="view-label" class="panel-title">Capture</h1>
    <button id="expand" class="icon-btn" type="button" aria-label="Expand Capture" aria-pressed="false"><span class="ms" aria-hidden="true">expand_content</span></button>
    <button id="menu-toggle" class="icon-btn" type="button" aria-label="More: planner, history, settings" aria-haspopup="menu" aria-expanded="false" aria-controls="quick-menu"><span class="ms" aria-hidden="true">more_vert</span></button>
    <button id="close" class="icon-btn" type="button" aria-label="Close Capture"><span class="ms" aria-hidden="true">close</span></button>
  </header>
  <div id="focus-line" class="focus-line" hidden>
    <span class="chip input-chip"><span class="ms" aria-hidden="true">flag</span><span id="focus-label" class="chip-label"></span><button id="focus-clear" type="button" class="chip-clear" aria-label="Clear planning context"><span class="ms" aria-hidden="true">close</span></button></span>
  </div>
  <div id="progress" class="linear top" role="progressbar" aria-label="Saving" hidden><i></i></div>
  <div id="content" class="content" tabindex="-1" aria-label="Capture response"></div>
  <button id="capture-overflow" class="more-below" type="button" hidden aria-label="Scroll down to see more of this response"><span class="ms" aria-hidden="true">arrow_downward</span>More below</button>
  <div id="capture-actions" class="action-dock" aria-label="Response actions" hidden></div>
  <footer class="composer-area">
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <form id="composer" class="composer" data-lines="one">
      <label class="sr-only" for="message">Capture a thought</label>
      <textarea id="message" rows="1" maxlength="12000" placeholder="Capture a thought"></textarea>
      <button id="dictate" class="icon-btn mic" type="button" aria-label="Voice input"><span class="ms" aria-hidden="true">mic</span></button>
      <button id="send" class="send" type="submit" aria-label="Send" aria-describedby="hold-hint" aria-haspopup="menu" aria-expanded="false" aria-controls="quick-menu"><span class="ms" aria-hidden="true">arrow_upward</span></button>
    </form>
    <p id="composer-hint" class="hint" hidden><span class="ms" aria-hidden="true">check</span><span id="hint-text">Draft saved</span></p>
    <span id="hold-hint" class="sr-only">Hold for planner and more.</span>
  </footer>
  <nav id="quick-menu" class="menu" aria-label="Capture options" role="menu" hidden inert>
    <div class="menu-items">
      <button id="about" role="menuitem" tabindex="-1" type="button"><span class="ms" aria-hidden="true">info</span><span>About</span></button>
      <button id="settings" role="menuitem" tabindex="-1" type="button"><span class="ms" aria-hidden="true">tune</span><span>Assistant settings</span></button>
      <button id="context-view" role="menuitem" tabindex="-1" type="button" aria-pressed="false"><span class="ms" aria-hidden="true">psychology</span><span>Context</span></button>
      <button id="history-view" role="menuitem" tabindex="-1" type="button" aria-pressed="false"><span class="ms" aria-hidden="true">history</span><span>History</span></button>
      <button id="starter-0" class="menu-divided" role="menuitem" tabindex="-1" type="button"><span class="ms" aria-hidden="true">today</span><span>What’s planned today?</span></button>
      <button id="starter-1" role="menuitem" tabindex="-1" type="button"><span class="ms" aria-hidden="true">flag</span><span>Plan a Result</span></button>
    </div>
    <button id="plans-view" class="menu-pinned" role="menuitem" tabindex="-1" type="button"><span class="ms" aria-hidden="true">calendar_month</span><span class="menu-label">Open planner<small id="planner-draft-note" hidden>Your draft is kept</small></span></button>
  </nav>
</section>
</main>
</body>
</html>
