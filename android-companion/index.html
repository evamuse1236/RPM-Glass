<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>RPM · Capture</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/capture.css">
<link rel="stylesheet" href="/capture-cards.css">
<link rel="stylesheet" href="/capture-chips.css">
<script type="module" src="/runtime.js"></script>
</head>
<body>
<main class="host">
<div id="stack" class="stack">
  <div id="content" class="cards" aria-label="Capture response" aria-live="polite"></div>
  <div id="forming" class="cards forming-list" aria-label="What Capture reads so far"></div>
  <section id="panel" class="bar" aria-label="RPM Capture" data-view="chat" data-busy="false" data-state="idle" data-has-text="false">
    <div class="grab" aria-hidden="true"></div>
    <form id="composer" class="composer">
      <label class="sr-only" for="message">Capture a thought</label>
      <textarea id="message" rows="1" maxlength="12000" placeholder="Capture a thought" enterkeyhint="send"></textarea>
      <div class="bar-row">
        <button id="more" class="bar-more" type="button" aria-label="More" aria-haspopup="dialog" aria-expanded="false" aria-controls="sheet"><span class="ms" aria-hidden="true">more_vert</span></button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button id="dictate" class="round mic" type="button" aria-label="Voice input"><span class="ms" aria-hidden="true">mic</span></button>
        <button id="send" class="round send" type="submit" aria-label="Send"><span class="ms" aria-hidden="true">arrow_upward</span></button>
      </div>
    </form>
  </section>
</div>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="More" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="rows">
    <button class="sheet-row" type="button" data-go="planner"><span class="ms" aria-hidden="true">calendar_month</span><span class="row-title">Planner</span></button>
    <button class="sheet-row" type="button" data-go="history"><span class="ms" aria-hidden="true">history</span><span class="row-title">History</span></button>
    <button class="sheet-row" type="button" data-go="context"><span class="ms" aria-hidden="true">psychology</span><span class="row-title">Context</span></button>
    <button class="sheet-row" type="button" data-go="settings"><span class="ms" aria-hidden="true">settings</span><span class="row-title">Settings</span></button>
  </div>
</section>
</main>
</body>
</html>
