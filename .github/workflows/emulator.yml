name: emulator
run-name: RPM emulator ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: '--all or space-separated scenario IDs'
        required: false
        default: '--all'
      request_id:
        description: 'Correlation ID used by ci:emulator'
        required: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
      SCENARIOS: ${{ inputs.scenarios || '--all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: npm ci
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd
        with:
          path: |
            ~/.android/avd
            ~/.android/adbkey
            ~/.android/adbkey.pub
          key: rpm-avd-${{ runner.os }}-36-playstore-x86_64-1080x2340-450-v3
      - name: Create clean AVD snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 36
          target: playstore
          arch: x86_64
          avd-name: Galaxy_S24_FE_API_36
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-boot-timeout: 180
          pre-emulator-launch-script: node scripts/ci/prepare-avd.mjs
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1080x2340
          script: echo 'Clean AVD snapshot ready'
      - name: Drive RPM scenarios
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 36
          target: playstore
          arch: x86_64
          avd-name: Galaxy_S24_FE_API_36
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-boot-timeout: 180
          pre-emulator-launch-script: node scripts/ci/prepare-avd.mjs
          emulator-options: -read-only -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1080x2340
          script: node scripts/ci/run-emulator.mjs
      - name: Collect teardown diagnostics
        if: always()
        run: |
          mkdir -p .verify/evidence
          adb devices -l > .verify/evidence/adb-devices.txt 2>&1 || true
          timeout 10s adb -s emulator-5554 logcat -d -v threadtime > .verify/evidence/logcat-final.txt 2>&1 || true
      - name: Upload screenshots, scenario results and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpm-emulator-evidence
          path: .verify/evidence/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the verified build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpm-emulator-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/assets/companion/**
          if-no-files-found: warn
          retention-days: 14
