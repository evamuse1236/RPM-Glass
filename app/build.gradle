plugins { id "com.android.application" }
def rpmLocalProperties = new Properties()
def rpmLocalFile = rootProject.file('local.properties')
if (rpmLocalFile.exists()) rpmLocalFile.withInputStream { rpmLocalProperties.load(it) }
def rpmDebugKeystore = rpmLocalProperties.getProperty('rpm.debugKeystore')
android {
    namespace "com.rpm.prototype"
    compileSdk 36
    defaultConfig {
        applicationId "com.rpm.prototype"
        minSdk 26
        targetSdk 36
        versionCode 29
        versionName "0.29-task-sheet-habits"
        testInstrumentationRunner "com.rpm.prototype.OfflineTests"
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (rpmDebugKeystore) {
        def originalKeystore = rootProject.file(rpmDebugKeystore)
        if (!originalKeystore.isFile()) throw new GradleException('Configured RPM signing keystore is missing.')
        signingConfigs {
            debug {
                storeFile originalKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}
dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
tasks.register('bundleCompanion', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/build-companion-assets.mjs'
    inputs.files(fileTree('../android-companion'), fileTree('../chat-prototype'), fileTree('../cli'), fileTree('../intent-v2/src'), fileTree('../intent-v2/adapters'), fileTree('../intent-v2/prompts'), file('../scripts/build-companion-assets.mjs'))
    outputs.dir('src/main/assets/companion')
}
tasks.named('preBuild').configure { dependsOn 'bundleCompanion' }
