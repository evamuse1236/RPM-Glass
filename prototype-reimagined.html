        phone: '<path d="M6.5 3.5 9 6l-1.8 1.8a12 12 0 0 0 5.5 5.5L15 11.5l2.5 2.5-1 1c-1.2 1.2-3.1 1-4.7.3A16 16 0 0 1 4.2 8.2c-.7-1.6-.9-3.5.3-4.7z"/>',
        spark: '<path d="M12 3v4M12 17v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M3 12h4M17 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>',
        list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
        layers: '<path d="m12 3 8 4.5-8 4.5-8-4.5zM4 12l8 4.5 8-4.5M4 16.5l8 4.5 8-4.5"/>',
        flag: '<path d="M5 21V4m0 1h11l-2 3 2 3H5"/>',
        arrow: '<path d="m9 18 6-6-6-6"/>',
        close: '<path d="M6 6l12 12M18 6 6 18"/>',
        window: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18M15 16h3"/>',
        leaf: '<path d="M19 3c-7 .2-12 3.5-12 9 0 3 2 5 5 5 5.5 0 8.8-5 9-12-2.2.1-4.2.5-6 1.2M5 21c2-5 5.2-8.8 10-11"/>',
        navToday: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/><circle cx="12" cy="15" r="2.2"/>',
        navRpm: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>',
        navProjects: '<path d="M3 7.5h7l2-2h3.5l2 2H21v11.5H3z"/><path d="M7 12h10"/>',
        navWeek: '<path d="M4 20V11M10 20V5M16 20v-7M22 20V8"/><path d="M2 20h22"/>'
      };
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || ''}</svg>`;
    }

    function taskGlyph(task) {
      const title = (task.title || '').toLowerCase();
      if (title.includes('email') || title.includes('reply') || title.includes('mail')) return 'mail';
      if (title.includes('call') || title.includes('phone')) return 'phone';
      if (title.includes('shop') || title.includes('buy')) return 'briefcase';
      if (title.includes('wrap') || title.includes('wind') || title.includes('sleep')) return 'moon';
      if (title.includes('plan') || title.includes('rise') || title.includes('morning')) return 'sun';
      if (task.rpm === 'Launch sprint' || task.color === 'launch') return 'target';
      if (task.rpm === 'Deep work' || task.color === 'deep') return 'spark';
      if (task.rpm === 'Life admin' || task.color === 'life') return 'list';
      return 'clock';
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function formatTime(minutes) {
      const h24 = Math.floor(minutes / 60);
      const min = minutes % 60;
      const suffix = h24 >= 12 && h24 < 24 ? 'PM' : 'AM';
      const h = h24 % 12 || 12;
      return `${h}:${String(min).padStart(2, '0')} ${suffix}`;
    }

    function formatHourLabel(minutes) {
      if (minutes >= 1440) return '12 AM';
      return formatTime(minutes).replace(':00 ', ' ');
    }

    function formatDuration(minutes) {
      if (minutes < 60) return `${minutes}m`;
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return m ? `${h}h ${m}m` : `${h}h`;
    }

    function formatHoursShort(minutes) {
      const h = minutes / 60;
      if (h === 0) return '0h';
      if (Number.isInteger(h)) return `${h}h`;
      return `${Math.round(h * 10) / 10}h`;
    }

    function edgeClass(task) {
      if (task.rpm === 'Launch sprint' || task.color === 'launch' || task.color === 'blue') return 'edge-launch';
      if (task.rpm === 'Deep work' || task.color === 'deep' || task.color === 'cyan') return 'edge-deep';
      if (task.rpm === 'Life admin' || task.color === 'life' || task.color === 'yellow') return 'edge-life';
      return 'edge-none';
    }

    function edgeFromRpm(rpm) {
      if (rpm === 'Launch sprint') return 'launch';
      if (rpm === 'Deep work') return 'deep';
      if (rpm === 'Life admin') return 'life';
      return 'none';
    }

    function appbar(title, action = '') {
      return `<header class="appbar"><div class="appbar-row">
        ${state.projectOpen ? `<button class="back-button" data-action="project-back" aria-label="Back">${icon('back')}</button>` : ''}
        <div style="flex:1"><h1>${title}</h1>${state.view === 'week' ? '<span class="subtitle">Aug 10–16</span>' : ''}</div>${action}
      </div></header>`;
    }

    function dateStrip() {
      return `<div class="date-strip" aria-label="Week dates">${DAYS.map((d, i) =>
        `<button class="date-button ${state.selectedDay === i ? 'selected' : ''}" data-day="${i}" aria-label="${d.label}" aria-pressed="${state.selectedDay === i}">
          <span class="dow">${d.dow}</span><span class="date">${d.date}</span>
        </button>`
      ).join('')}</div>`;
    }

    function unscheduledTray() {
      const tasks = state.tasks.filter(t => t.day === state.selectedDay && t.start == null);
      return `<button class="tray" data-action="toggle-unscheduled" aria-expanded="${state.unscheduledOpen}" aria-label="Unscheduled tasks, ${tasks.length}">
          <span class="label">Unscheduled</span>
          <span class="count">${tasks.length}</span>
          <span class="chev" aria-hidden="true">${icon('down')}</span>
        </button>
        ${state.unscheduledOpen ? `<div class="tray-list">${tasks.length
          ? tasks.map(t => `<button class="tray-item" data-task="${t.id}"><span class="rail ${edgeClass(t)}"></span><b>${escapeHtml(t.title)}</b><small>${formatDuration(t.duration)}</small></button>`).join('')
          : '<div class="empty">No unscheduled tasks for this day.</div>'}</div>` : ''}`;
    }

    function todayUnscheduledControl() {
      const tasks = state.tasks.filter(t => t.day === state.selectedDay && t.start == null);
      return `<button class="today-unscheduled" data-action="toggle-unscheduled" aria-expanded="${state.unscheduledOpen}" aria-label="Unscheduled tasks, ${tasks.length}">
          <span>Unscheduled</span><span class="count">${tasks.length}</span><span aria-hidden="true">${icon('down')}</span>
        </button>
        ${state.unscheduledOpen ? `<div class="today-unscheduled-list tray-list">${tasks.length
          ? tasks.map(t => `<button class="tray-item" data-task="${t.id}"><span class="rail ${edgeClass(t)}"></span><b>${escapeHtml(t.title)}</b><small>${formatDuration(t.duration)}</small></button>`).join('')
          : '<div class="empty">No unscheduled tasks for this day.</div>'}</div>` : ''}`;
    }

    function tasksTimeOverlap(a, b) {
      return a.start != null && b.start != null
        && a.start < b.start + b.duration
        && b.start < a.start + a.duration;
    }

    function assignLanes(dayTasks) {
      // Ensure overlapping tasks get distinct left/right lanes when not already set
      const sorted = [...dayTasks].sort((a, b) => a.start - b.start || b.duration - a.duration);
      sorted.forEach(t => {
        const overlaps = sorted.filter(o => o !== t && tasksTimeOverlap(t, o));
        if (!overlaps.length) return;
        if (t.lane) return;
        if (overlaps.some(o => o.lane === 'left')) t.lane = 'right';
        else if (overlaps.some(o => o.lane === 'right')) t.lane = 'left';
        else t.lane = 'left';
      });
      // Resolve same-lane collisions among overlaps
      sorted.forEach(t => {
        const overlaps = sorted.filter(o => o !== t && tasksTimeOverlap(t, o));
        if (!overlaps.length) return;
        if (!t.lane) t.lane = 'left';
        if (overlaps.some(o => o.lane === t.lane && (o.start < t.start || (o.start === t.start && o.id < t.id)))) {
          t.lane = t.lane === 'left' ? 'right' : 'left';
        }
      });
    }

    /** Visual end minute for a card (min height can extend past duration). */
    function visualTaskEnd(t, minPx = 56) {
      const minMinutes = Math.ceil((minPx / TODAY_HOUR_H) * 60);
      return t.start + Math.max(t.duration, minMinutes);
    }

    function formatTimeRange(start, duration) {
      const end = start + duration;
      if (duration <= 15) return `${formatTime(start)} · ${formatDuration(duration)}`;
      return `${formatTime(start)} – ${formatTime(end)} (${formatDuration(duration)})`;
    }

    function gapMessage(minutes, index) {
      const label = formatDuration(minutes);
      const variants = [
        `Use <strong>${label}</strong> wisely. Create away!`,
        `You have <strong>${label}</strong>. Plan it.`,
        `<strong>${label}</strong> open. Shape it.`
      ];
      return variants[index % variants.length];
    }

    function buildGaps(dayTasks, conflictIds = new Set()) {
      // Free gaps use visual card bottoms so prompts never sit under min-height overflow
      const sorted = [...dayTasks].sort((a, b) => a.start - b.start || a.duration - b.duration);
      const gaps = [];
      let cursor = DAY_START;
      let gapIndex = 0;
      sorted.forEach(t => {
        if (t.start > cursor + 20) {
          const minutes = t.start - cursor;
          gaps.push({ start: cursor, end: t.start, minutes, index: gapIndex++ });
        }
        const minPx = conflictIds.has(t.id) ? 48 : 56;
        cursor = Math.max(cursor, t.start + t.duration, visualTaskEnd(t, minPx));
      });
      if (cursor < DAY_END - 20) {
        gaps.push({ start: cursor, end: DAY_END, minutes: DAY_END - cursor, index: gapIndex++ });
      }
      return gaps;
    }

    function timeline(day = state.selectedDay) {
      const dayTasks = state.tasks.filter(t => t.day === day && t.start != null);
      assignLanes(dayTasks);

      const taskStarts = dayTasks.map(t => t.start);
      const markerMinutes = new Set([DAY_START, DAY_END, ...taskStarts]);
      dayTasks.forEach(t => {
        const end = Math.min(DAY_END, t.start + t.duration);
        const nextStartIsTooClose = taskStarts.some(start => start > end && start - end < 30);
        if (!nextStartIsTooClose) markerMinutes.add(end);
      });
      const hourRows = [...markerMinutes]
        .sort((a, b) => a - b)
        .map(minute => {
          const top = ((minute - DAY_START) / 60) * TODAY_HOUR_H;
          const label = formatTime(minute).replace(' AM', '').replace(' PM', '');
          return `<div class="hour-row" style="top:${top}px"><span>${label}</span></div>`;
        }).join('');

      const conflictIds = new Set();
      dayTasks.forEach(t => {
        if (dayTasks.some(o => o !== t && tasksTimeOverlap(t, o))) conflictIds.add(t.id);
      });
      // Ensure conflict pairs always have opposing lanes
      dayTasks.forEach(t => {
        if (!conflictIds.has(t.id)) return;
        if (!t.lane) t.lane = 'left';
      });

      const cards = dayTasks.map(t => {
        const isConflict = conflictIds.has(t.id);
        const top = ((t.start - DAY_START) / 60) * TODAY_HOUR_H;
        const minH = isConflict ? 48 : 56;
        const height = Math.max(minH, (t.duration / 60) * TODAY_HOUR_H);
        const lane = t.lane ? `lane-${t.lane}` : '';
        const conflictCls = isConflict ? 'is-conflict' : '';
        const tall = t.duration >= 60 && !isConflict ? 'tall-node' : '';
        const glyph = taskGlyph(t);
        const completeLabel = t.complete ? 'Mark incomplete' : 'Mark complete';
        const meta = isConflict
          ? `${formatTime(t.start)} – ${formatTime(t.start + t.duration)}`
          : formatTimeRange(t.start, t.duration);
        return `<article class="task-card ${edgeClass(t)} ${lane} ${conflictCls} ${tall} ${state.selectedTask === t.id ? 'selected' : ''} ${t.complete ? 'complete' : ''}"
          data-task="${t.id}" tabindex="0" role="button"
          style="top:${top}px;height:${height}px"
          aria-label="${escapeHtml(t.title)}, ${formatTime(t.start)}, ${formatDuration(t.duration)}${t.must ? ', must' : ''}${t.complete ? ', complete' : ''}">
          <div class="task-node" aria-hidden="true">${icon(glyph)}</div>
          <div class="task-body">
            <div class="task-meta">
              <span>${meta}</span>
              ${t.must ? '<span class="must-mark" title="Must task">★</span>' : ''}
            </div>
            <div class="task-title">${escapeHtml(t.title)}</div>
          </div>
          <button class="task-complete ${t.complete ? 'is-done' : ''}" data-action="toggle-complete" data-id="${t.id}"
            aria-label="${completeLabel}: ${escapeHtml(t.title)}" title="${completeLabel}">
            ${t.complete ? icon('check') : ''}
          </button>
          <button class="resize-handle" data-resize="${t.id}" aria-label="Resize ${escapeHtml(t.title)}"></button>
        </article>`;
      }).join('');

      const gaps = buildGaps(dayTasks, conflictIds).map(g => {
        const top = ((g.start - DAY_START) / 60) * TODAY_HOUR_H;
        const height = ((g.end - g.start) / 60) * TODAY_HOUR_H;
        // Only show prompt when message + Add task fit without spilling into tasks
        if (height < 56) return '';
        return `<div class="timeline-gap" style="top:${top}px;height:${height}px">
          <div class="gap-msg"><span class="gap-icon">${icon('clock')}</span><span>${gapMessage(g.minutes, g.index)}</span></div>
          <button class="gap-add" data-action="add-at" data-start="${g.start}" data-day="${day}" aria-label="Add task at ${formatTime(g.start)}">
            ${icon('plus')} Add task
          </button>
        </div>`;
      }).join('');

      const nowTop = ((NOW_MIN - DAY_START) / 60) * TODAY_HOUR_H;
      const showNow = day === 1; // demo "now" on Tuesday sample day
      return `<div class="timeline-wrap">
        <div class="timeline-handle" aria-hidden="true"></div>
        <div class="timeline" data-timeline="${day}" tabindex="0" aria-label="Day timeline from 7 AM to midnight. Click empty time to create a task.">
          ${hourRows}
          <div class="timeline-spine" aria-hidden="true"></div>
          ${showNow ? `<div class="current-line" style="top:${nowTop}px" aria-hidden="true"></div>` : ''}
          ${gaps}
          ${cards}
        </div>
      </div>`;
    }

    function todayHeading() {
      const d = DAYS[state.selectedDay];
      const month = 'August';
      return `<button class="icon-button" data-action="calendar" aria-label="Open calendar for ${month} ${d.date}, 2026" style="width:auto;height:auto;border-radius:12px;padding:4px 2px;justify-self:start">
        <h1 class="today-heading">${month} ${d.date}, <span class="year">2026</span><span class="chev" aria-hidden="true">${icon('down')}</span></h1>
      </button>`;
    }

    function todayView() {
      return `<header class="appbar today-appbar"><div class="appbar-row">${todayHeading()}</div></header>
        <section class="content content-today">${dateStrip()}${todayUnscheduledControl()}${timeline()}</section>`;
    }

    function rpmTaskRow(t) {
      const selectable = state.rpmSelecting;
      const selected = state.selectedRpmTasks.includes(t.id);
      return `<div class="rpm-task ${t.complete ? 'done' : ''}" data-rpm-row="${t.id}">
        <button class="check-button" data-action="${selectable ? 'select-rpm-task' : 'complete-rpm-task'}" data-id="${t.id}"
          aria-label="${selectable ? 'Select' : 'Complete'} ${escapeHtml(t.title)}">
          <span class="check-circle ${selectable && selected ? 'selected' : ''}">${selectable ? (selected ? '✓' : '') : (t.complete ? '✓' : '')}</span>
        </button>
        <span class="must" title="${t.must ? 'Must task' : 'Optional'}">${t.must ? '★' : '☆'}</span>
        <span class="priority">${t.priority}</span>
        <span class="rpm-title">${escapeHtml(t.title)}</span>
        <span class="duration">${formatDuration(t.duration)}</span>
      </div>`;
    }

    function rpmView() {
      const shown = state.rpmTasks.filter(t => state.rpmFilter === 'all' || t.must);
      const allTime = state.rpmTasks.reduce((sum, t) => sum + t.duration, 0);
      const allRemaining = state.rpmTasks.filter(t => !t.complete).reduce((sum, t) => sum + t.duration, 0);
      const mustTime = state.rpmTasks.filter(t => t.must).reduce((sum, t) => sum + t.duration, 0);
      const mustRemaining = state.rpmTasks.filter(t => t.must && !t.complete).reduce((sum, t) => sum + t.duration, 0);
      const timeSummary = state.rpmFilter === 'must'
        ? `Must time ${formatDuration(mustTime)} · Must remaining ${formatDuration(mustRemaining)}`
        : `All time ${formatDuration(allTime)} · Remaining ${formatDuration(allRemaining)}`;
      const selectedTime = state.rpmTasks.filter(t => state.selectedRpmTasks.includes(t.id)).reduce((n, t) => n + t.duration, 0);

      const launchOpen = state.rpmOpen === 'launch';
      const launchBody = launchOpen ? `<div class="block-body">
          <div class="rp-stack">
            <p class="rp-purpose"><b>Purpose</b>${escapeHtml(RPM_BLOCKS[0].purpose)}</p>
          </div>
          <div class="meta-line">${icon('clock')}<span>${timeSummary}</span></div>
          <div class="segment" role="tablist" aria-label="Task filter">
            <button class="${state.rpmFilter === 'all' ? 'selected' : ''}" data-rpm-filter="all">All</button>
            <button class="${state.rpmFilter === 'must' ? 'selected' : ''}" data-rpm-filter="must">Must only</button>
          </div>
          <div class="rpm-task-list">${shown.map(rpmTaskRow).join('')}</div>
          <div class="block-actions">
            <button class="tonal-button" data-action="add-rpm-task">${icon('plus')}<span>Add task</span></button>
            <button class="tonal-button" data-action="rpm-select-mode">${icon('calendar')}<span>${state.rpmSelecting ? 'Cancel' : 'Schedule'}</span></button>
          </div>
        </div>` : '';

      const blockIcons = { launch: 'target', deep: 'spark', life: 'list' };
      const blockCards = RPM_BLOCKS.map(b => {
        const open = b.id === 'launch' && launchOpen;
        const remaining = b.id === 'launch' ? formatDuration(allRemaining) : b.remaining;
        const taskCount = b.id === 'launch' ? state.rpmTasks.length : b.tasks;
        const action = b.id === 'launch' ? 'toggle-rpm' : 'toast-block';
        const expandState = b.id === 'launch' ? ` aria-expanded="${open}"` : '';
        const trailingIcon = b.id === 'launch' ? 'down' : 'arrow';
        return `<article class="block ${open ? 'open' : ''}" style="view-transition-name: rpm-${b.id}">
          <button class="block-stub" data-action="${action}" data-id="${b.id}"${expandState}>
            <span class="rpm-block-icon" aria-hidden="true">${icon(blockIcons[b.id])}</span>
            <span class="block-stub-copy">
              <strong>${escapeHtml(b.title)}</strong>
              <span class="rpm-card-result">${escapeHtml(b.result)}</span>
              <span class="rpm-card-state"><span class="rpm-card-state-text">${open ? 'Open' : 'Ready'} · ${remaining} · ${taskCount} tasks</span></span>
            </span>
            <span class="rpm-chevron" aria-hidden="true">${icon(trailingIcon)}</span>
          </button>
          ${open ? launchBody : ''}
        </article>`;
      }).join('');

      return `${appbar('RPM', `<button class="tonal-button" data-action="new-block">${icon('plus')}<span>New block</span></button>`)}
        <section class="content">
          <button class="tray" data-action="toast-unassigned" aria-expanded="false">
            <span class="label">Unassigned tasks</span>
            <span class="count">4</span>
            <span class="chev" aria-hidden="true">${icon('down')}</span>
          </button>
          <h2 class="section-label">RPM blocks</h2>
          <div class="block-list">${blockCards}</div>
          ${state.rpmSelecting ? `<div class="selection-bar"><b>${state.selectedRpmTasks.length} selected · ${formatDuration(selectedTime)}</b>
            <button data-action="schedule-selection" ${!state.selectedRpmTasks.length ? 'disabled' : ''}>Schedule</button></div>` : ''}
        </section>`;
    }

    function projectCard(p) {
      const glyphs = {
        website: 'window',
        launch: 'target',
        growth: 'leaf'
      };
      const glyph = glyphs[p.id] || 'folder';
      const deadlineMeta = p.status === 'complete'
        ? 'Done'
        : p.status === 'onhold'
          ? 'On hold'
          : p.deadline === 'No deadline'
            ? 'Flexible'
            : 'Deadline';
      return `<article class="project-card">
        <button class="project-reference-main" data-project="${p.id}" aria-label="Open ${escapeHtml(p.name)}">
          <div class="project-reference-head">
            <span class="project-reference-icon" aria-hidden="true">${icon(glyph)}</span>
            <span class="project-reference-title">
              <strong>${escapeHtml(p.name)}</strong>
              <small>${icon('calendar')}${escapeHtml(p.deadline)}</small>
            </span>
            <span class="project-more" aria-hidden="true">•••</span>
          </div>
          <div class="project-progress-row" aria-label="${p.progress}% complete">
            <span class="project-progress-track" aria-hidden="true"><i style="width:${p.progress}%"></i></span>
            <b>${p.progress}%</b>
          </div>
          <div class="project-metrics" aria-label="Project metrics">
            <span class="project-metric">${icon('clock')}<b>${escapeHtml(p.remaining)}</b><em>remaining</em></span>
            <span class="project-metric">${icon('layers')}<b>${p.tasks} tasks</b><em>${p.blocks} RPM ${p.blocks === 1 ? 'block' : 'blocks'}</em></span>
            <span class="project-metric">${icon('flag')}<b>${escapeHtml(p.deadline)}</b><em>${escapeHtml(deadlineMeta)}</em></span>
          </div>
          <span class="project-next-panel">
            <span class="project-next-spark" aria-hidden="true">✦</span>
            <span class="project-next-copy"><b>Next task</b> · ${escapeHtml(p.next)}</span>
            <span class="project-next-arrow" aria-hidden="true">${icon('arrow')}</span>
          </span>
        </button>
      </article>`;
    }

    function projectDetail(p) {
      const glyphs = { website: 'window', launch: 'target', growth: 'leaf' };
      const glyph = glyphs[p.id] || 'folder';
      const deadlineMeta = p.deadline === 'No deadline' ? 'Flexible' : 'Deadline';
      return `<header class="project-detail-header">
          <div class="project-detail-title-row">
            <button class="project-detail-back" data-action="project-back" aria-label="Back to projects">${icon('back')}</button>
            <span class="project-detail-header-icon" aria-hidden="true">${icon(glyph)}</span>
            <div class="project-detail-title-copy"><small>Project</small><h1>${escapeHtml(p.name)}</h1></div>
          </div>
        </header>
        <section class="content project-detail-content">
          <article class="project-detail-hero">
            <div class="project-detail-outcome">
              <span class="project-reference-icon" aria-hidden="true">${icon(glyph)}</span>
              <div><h2>Outcome</h2><p>${escapeHtml(p.goal)}</p></div>
            </div>
            <div class="project-progress-row" aria-label="${p.progress}% complete">
              <span class="project-progress-track" aria-hidden="true"><i style="width:${p.progress}%"></i></span>
              <b>${p.progress}%</b>
            </div>
            <div class="project-metrics" aria-label="Project metrics">
              <span class="project-metric">${icon('clock')}<b>${escapeHtml(p.remaining)}</b><em>remaining</em></span>
              <span class="project-metric">${icon('layers')}<b>${p.tasks} tasks</b><em>${p.blocks} RPM ${p.blocks === 1 ? 'block' : 'blocks'}</em></span>
              <span class="project-metric">${icon('flag')}<b>${escapeHtml(p.deadline)}</b><em>${deadlineMeta}</em></span>
            </div>
            <button class="project-next-panel" data-action="project-schedule">
              <span class="project-next-spark" aria-hidden="true">✦</span>
              <span class="project-next-copy"><b>Next task</b> · ${escapeHtml(p.next)}</span>
              <span class="project-next-arrow" aria-hidden="true">${icon('arrow')}</span>
            </button>
          </article>

          <article class="project-detail-section">
            <div class="project-detail-section-heading">
              <span class="project-detail-section-icon" aria-hidden="true">${icon('target')}</span>
              <div><h2>RPM blocks</h2><p>${p.blocks} connected to this project</p></div>
            </div>
            <button class="project-detail-rpm" data-action="toast-block">
              <span aria-hidden="true">${icon('target')}</span>
              <span class="project-detail-item-copy"><strong>Launch sprint</strong><small>Ship a clear launch story · 3h · 4 tasks</small></span>
              ${icon('arrow')}
            </button>
          </article>

          <article class="project-detail-section">
            <div class="project-detail-section-heading">
              <span class="project-detail-section-icon" aria-hidden="true">${icon('list')}</span>
              <div><h2>Unassigned tasks</h2><p>Tasks not yet in an RPM block</p></div>
            </div>
            <button class="project-detail-task" data-action="project-schedule">
              <span aria-hidden="true">${icon('list')}</span>
              <span class="project-detail-item-copy"><strong>Check project notes</strong><small>30m · Ready to schedule</small></span>
              ${icon('arrow')}
            </button>
            <button class="project-detail-schedule" data-action="project-schedule">${icon('calendar')}<span>Schedule project tasks</span></button>
          </article>
        </section>`;
    }

    function projectsView() {
      if (state.projectOpen) {
        const p = projects.find(x => x.id === state.projectOpen);
        if (p) return projectDetail(p);
      }
      const filtered = projects.filter(p => p.status === state.projectFilter);
      return `${appbar('Projects', `<button class="tonal-button" data-action="new-project">${icon('plus')}<span>New project</span></button>`)}
        <section class="content">
          <div class="filter-row" role="tablist" aria-label="Project filters">
            ${[['active','Active'],['onhold','On hold'],['complete','Complete']].map(([id, label]) =>
              `<button class="chip ${state.projectFilter === id ? 'selected' : ''}" data-project-filter="${id}">${label}</button>`
            ).join('')}
          </div>
          <div class="project-list">
            ${filtered.map(projectCard).join('') || '<div class="empty">No projects in this group.</div>'}
          </div>
        </section>`;
    }

    function weekWorkloadCard() {
      const maxMinutes = Math.max(...WEEK_PLAN_MINUTES, 60);
      const totalMinutes = WEEK_PLAN_MINUTES.reduce((sum, minutes) => sum + minutes, 0);
      const bars = DAYS.map((d, i) => {
        const minutes = WEEK_PLAN_MINUTES[i];
        const over = minutes > FOCUS_BUDGET;
        const selected = state.selectedDay === i;
        const height = Math.max(5, Math.round((minutes / maxMinutes) * 100));
        return `<button type="button" class="week-bar ${selected ? 'selected' : ''} ${over ? 'over' : ''}"
          data-day="${i}" style="--bar:${height}%"
          aria-label="${d.label}, ${formatHoursShort(minutes)} planned${over ? ', overload' : ''}"
          aria-pressed="${selected}">
          <span class="bar-hours">${over ? '⚠ ' : ''}${formatHoursShort(minutes)}</span>
          <span class="bar-well" aria-hidden="true"><i class="bar-fill"></i></span>
          <span class="bar-day">${d.dow.slice(0, 1)}</span>
          <span class="bar-date">${d.date}</span>
        </button>`;
      }).join('');

      return `<article class="week-hours-card">
        <div class="week-hours-heading">
          <h2>Planned hours</h2>
          <strong>${formatHoursShort(totalMinutes)}</strong><span>total</span>
        </div>
        <div class="week-chart" aria-label="Planned workload by day">${bars}</div>
      </article>`;
    }

    function weekUnscheduledTray() {
      const tasks = state.tasks.filter(t => t.day === state.selectedDay && t.start == null);
      return `<button class="week-unscheduled" data-action="toggle-unscheduled" aria-expanded="${state.unscheduledOpen}" aria-label="Unscheduled tasks, ${tasks.length}">
          <span class="week-unscheduled-icon" aria-hidden="true">${icon('list')}</span>
          <span class="week-unscheduled-copy"><strong>Unscheduled tasks</strong><small>${tasks.length} ${tasks.length === 1 ? 'task' : 'tasks'}</small></span>
          <span class="chev" aria-hidden="true">${icon('down')}</span>
        </button>
        ${state.unscheduledOpen ? `<div class="tray-list week-tray-list">${tasks.length
          ? tasks.map(t => `<button class="tray-item" data-task="${t.id}"><span class="rail ${edgeClass(t)}"></span><b>${escapeHtml(t.title)}</b><small>${formatDuration(t.duration)}</small></button>`).join('')
          : '<div class="empty">No unscheduled tasks for this day.</div>'}</div>` : ''}`;
    }

    function agendaRow(t) {
      const glyph = t.complete ? 'check' : taskGlyph(t);
      return `<article class="agenda-row ${edgeClass(t)} ${t.complete ? 'complete' : ''}" data-task="${t.id}" tabindex="0" role="button"
        aria-label="${escapeHtml(t.title)}, ${formatTime(t.start)}, ${formatDuration(t.duration)}${t.must ? ', must' : ''}${t.complete ? ', complete' : ''}">
        <span class="agenda-glyph" aria-hidden="true">${icon(glyph)}</span>
        <div class="agenda-copy">
          <strong>${escapeHtml(t.title)}</strong>
          <small>${formatTime(t.start)} – ${formatTime(t.start + t.duration)}${t.rpm ? ` · ${escapeHtml(t.rpm)}` : ''}</small>
        </div>
        <span class="agenda-duration">${t.must ? '<span class="must-symbol" title="Must task">★</span>' : ''}${formatDuration(t.duration)}</span>
      </article>`;
    }

    function weekView() {
      const dayTasks = state.tasks
        .filter(t => t.day === state.selectedDay && t.start != null)
        .sort((a, b) => a.start - b.start);
      const selectedDay = DAYS[state.selectedDay];
      const agendaLabel = state.selectedDay === 1
        ? `Today, Aug ${selectedDay.date}`
        : `${selectedDay.dow}, Aug ${selectedDay.date}`;
      return `<header class="week-header">
          <div class="week-title-row">
            <div class="week-title-copy"><h1>Week</h1><p>Shape a calm, intentional week.</p></div>
            <button class="week-calendar-button" data-action="calendar" aria-label="Open calendar">${icon('calendar')}</button>
          </div>
          <button class="week-range" data-action="calendar" aria-label="Choose week, August 10 to 16">
            ${icon('back')}<span>Aug 10 – 16</span>${icon('arrow')}
          </button>
        </header>
        <section class="content week-content">
          ${weekWorkloadCard()}
          ${weekUnscheduledTray()}
          <h2 class="week-day-heading">${agendaLabel}</h2>
          <div class="agenda-list">
            ${dayTasks.length
              ? dayTasks.map(agendaRow).join('')
              : '<div class="empty">Nothing is scheduled. Use + to capture a task.</div>'}
          </div>
        </section>`;
    }

    function statePanel() {
      const visible = {
        view: state.view,
        day: DAYS[state.selectedDay].label,
        selectedTask: state.selectedTask,
        rpmFilter: state.rpmFilter,
        rpmSelecting: state.rpmSelecting,
        selectedRpmTasks: state.selectedRpmTasks,
        projectFilter: state.projectFilter,
        projectOpen: state.projectOpen
      };
      return `<details class="state-panel"><summary>Prototype state</summary><pre>${JSON.stringify(visible, null, 2)}</pre></details>`;
    }

    function bottomNav() {
      const items = [
        ['today', 'navToday', 'Today'],
        ['rpm', 'navRpm', 'RPM'],
        ['projects', 'navProjects', 'Projects'],
        ['week', 'navWeek', 'Week']
      ];
      return `<nav class="bottom-nav" aria-label="Main navigation">${items.map(([id, ic, label]) =>
        `<button class="nav-item ${state.view === id ? 'selected' : ''}" data-view="${id}" aria-current="${state.view === id ? 'page' : 'false'}">
          <span class="nav-icon">${icon(ic)}</span><span>${label}</span>
        </button>`
      ).join('')}</nav>`;
    }

    function captureUI() {
      if (!state.captureOpen) return '';
      return `<div class="capture">
        <label class="sr-only" for="capture-input">Task title</label>
        <input id="capture-input" autocomplete="off" placeholder="Add a task…">
        <button data-action="capture-done">Done</button>
      </div>`;
    }

    function taskSheet() {
      if (!state.taskSheetOpen || state.selectedTask == null) return '';
      const t = state.tasks.find(task => task.id === state.selectedTask);
      if (!t) return '';
      return `<div class="scrim" data-action="close-sheet"></div>
        <section class="sheet task-sheet" role="dialog" aria-modal="true" aria-label="Task details">
          <div class="sheet-handle"></div>
          <div class="task-sheet-heading">
            <span class="task-sheet-icon" aria-hidden="true">${icon(taskGlyph(t))}</span>
            <div><h2>Task details</h2><p>Edit the task and its schedule.</p></div>
            <button class="task-sheet-close" data-action="close-sheet" aria-label="Close task details">${icon('close')}</button>
          </div>
          <div class="field"><label for="task-title">Title</label><input id="task-title" value="${escapeHtml(t.title)}"></div>
          <div class="field"><label for="task-notes">Notes</label><textarea id="task-notes" placeholder="Plain notes">${escapeHtml(t.notes || '')}</textarea></div>
          <div class="field-row">
            <div class="field"><label for="task-date">Day</label>
              <select id="task-date">${DAYS.map((d, i) => `<option value="${i}" ${t.day === i ? 'selected' : ''}>${d.label}</option>`).join('')}</select>
            </div>
            <div class="field"><label for="task-time">Start time</label>
              <input id="task-time" type="time" step="900" value="${t.start == null ? '' : `${String(Math.floor(t.start / 60)).padStart(2, '0')}:${String(t.start % 60).padStart(2, '0')}`}">
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label for="task-duration">Duration</label>
              <select id="task-duration">${[15, 30, 45, 60, 90, 120, 180].map(n =>
                `<option value="${n}" ${t.duration === n ? 'selected' : ''}>${formatDuration(n)}</option>`
              ).join('')}</select>
            </div>
            <div class="field"><label for="task-priority">Priority number</label>
              <input id="task-priority" type="number" min="1" max="99" value="${t.priority || 1}">
            </div>
          </div>
          <div class="field"><label for="task-rpm">RPM block</label>
            <select id="task-rpm">
              <option value="">No RPM block</option>
              ${['Launch sprint', 'Deep work', 'Life admin'].map(v =>
                `<option ${t.rpm === v ? 'selected' : ''}>${v}</option>`
              ).join('')}
            </select>
          </div>
          <label class="toggle-row"><input id="task-must" type="checkbox" ${t.must ? 'checked' : ''}><span><b>Must task</b><br><small style="color:var(--mute)">Priority number stays separate.</small></span></label>
          <label class="toggle-row"><input id="task-complete" type="checkbox" ${t.complete ? 'checked' : ''}><span><b>Complete</b></span></label>
          <div class="sheet-actions">
            <button class="delete" data-action="delete-task">Delete</button>
            <button class="save" data-action="save-task">Save task</button>
          </div>
        </section>`;
    }

    function scheduleSheet() {
      if (!state.scheduleOpen) return '';
      const chosen = state.rpmTasks.filter(t => state.selectedRpmTasks.includes(t.id));
      const total = chosen.reduce((n, t) => n + t.duration, 0);
      return `<div class="scrim" data-action="close-schedule"></div>
        <section class="sheet" role="dialog" aria-modal="true" aria-label="Schedule selected tasks">
          <div class="sheet-handle"></div>
          <h2>Schedule selected tasks</h2>
          <p style="margin:0 0 8px;color:var(--mute)">${chosen.length} tasks · ${formatDuration(total)}</p>
          <div class="schedule-list">${chosen.map(t =>
            `${t.must ? '★' : '☆'} ${t.priority}. ${escapeHtml(t.title)} · ${formatDuration(t.duration)}`
          ).join('<br>')}</div>
          <div class="field-row">
            <div class="field"><label for="schedule-day">Day</label>
              <select id="schedule-day">${DAYS.map((d, i) =>
                `<option value="${i}" ${i === 1 ? 'selected' : ''}>${d.label}</option>`
              ).join('')}</select>
            </div>
            <div class="field"><label for="schedule-time">Start at</label>
              <input id="schedule-time" type="time" value="09:00" step="900">
            </div>
          </div>
          <div class="field"><label for="schedule-placement">Placement</label>
            <select id="schedule-placement">
              <option value="separate">Separate tasks</option>
              <option value="block">One large RPM block</option>
            </select>
          </div>
          <div class="sheet-actions">
            <button class="text-button" data-action="close-schedule">Cancel</button>
            <button class="save" data-action="confirm-schedule">Place on timeline</button>
          </div>
        </section>`;
    }

    function render() {
      const views = { today: todayView, rpm: rpmView, projects: projectsView, week: weekView };
      const showFab = !state.captureOpen
        && !state.scheduleOpen
        && !(state.view === 'rpm' && state.rpmSelecting);

      document.getElementById('phone').className = `phone view-${state.view}`;
      document.getElementById('phone').innerHTML =
        `<div class="app">${views[state.view]()}</div>`
        + (showFab ? `<button class="fab" data-action="capture" aria-label="Capture task">${icon('plus')}</button>` : '')
        + captureUI()
        + bottomNav()
        + taskSheet()
        + scheduleSheet()
        + (state.toast ? `<div class="toast" role="status">${escapeHtml(state.toast)}</div>` : '');

      if (state.captureOpen) requestAnimationFrame(() => document.getElementById('capture-input')?.focus());
      if (state.taskSheetOpen) requestAnimationFrame(() => document.getElementById('task-title')?.focus());
      if (state.scheduleOpen) requestAnimationFrame(() => document.getElementById('schedule-day')?.focus());

      // Today opens at scrollY 0 so the large date heading stays visible (no auto-scroll).

    }

    function toast(message) {
      state.toast = message;
      render();
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => { state.toast = ''; render(); }, 1800);
    }

    function openTask(id) {
      state.selectedTask = Number(id);
      state.taskSheetOpen = true;
      state.captureOpen = false;
      render();
    }

    function captureTask() {
      const input = document.getElementById('capture-input');
      const title = input?.value.trim();
      if (!title) return;
      const rpm = state.view === 'rpm' && state.rpmOpen === 'launch' ? 'Launch sprint' : '';
      state.tasks.push({
        id: Date.now(),
        title,
        day: state.selectedDay,
        start: null,
        duration: 30,
        rpm,
        color: edgeFromRpm(rpm),
        must: false,
        priority: state.tasks.length + 1,
        notes: '',
        complete: false
      });
      input.value = '';
      toast(`Added “${title}” to ${state.view === 'rpm' ? 'Launch sprint' : DAYS[state.selectedDay].label}`);
      state.captureOpen = true;
    }

    function saveTask() {
      const t = state.tasks.find(task => task.id === state.selectedTask);
      if (!t) return;
      t.title = document.getElementById('task-title').value.trim() || 'Untitled task';
      t.notes = document.getElementById('task-notes').value;
      t.day = Number(document.getElementById('task-date').value);
      const time = document.getElementById('task-time').value;
      t.start = time ? Number(time.split(':')[0]) * 60 + Number(time.split(':')[1]) : null;
      t.duration = Number(document.getElementById('task-duration').value);
      t.priority = Number(document.getElementById('task-priority').value) || 1;
      t.rpm = document.getElementById('task-rpm').value;
      t.color = edgeFromRpm(t.rpm);
      t.must = document.getElementById('task-must').checked;
      t.complete = document.getElementById('task-complete').checked;
      state.taskSheetOpen = false;
      state.selectedDay = t.day;
      toast('Task saved');
    }

    function confirmSchedule() {
      const day = Number(document.getElementById('schedule-day').value);
      const [h, m] = document.getElementById('schedule-time').value.split(':').map(Number);
      const placement = document.getElementById('schedule-placement').value;
      let cursor = h * 60 + m;
      const chosen = state.rpmTasks.filter(t => state.selectedRpmTasks.includes(t.id));
      if (placement === 'block') {
        state.tasks.push({
          id: Date.now(),
          title: 'Launch sprint block',
          day,
          start: cursor,
          duration: chosen.reduce((n, t) => n + t.duration, 0),
          rpm: 'Launch sprint',
          color: 'launch',
          must: chosen.some(t => t.must),
          priority: 1,
          notes: chosen.map(t => t.title).join('\n'),
          complete: false
        });
      } else {
        chosen.forEach((t, i) => {
          state.tasks.push({
            id: Date.now() + i,
            title: t.title,
            day,
            start: cursor,
            duration: t.duration,
            rpm: 'Launch sprint',
            color: 'launch',
            must: t.must,
            priority: t.priority,
            notes: '',
            complete: false
          });
          cursor += t.duration;
        });
      }
      state.scheduleOpen = false;
      state.rpmSelecting = false;
      state.selectedRpmTasks = [];
      state.view = 'today';
      state.selectedDay = day;
      toast('Tasks placed on the timeline');
    }

    function createScheduledTask(day, start, duration = 30) {
      const id = Date.now();
      state.tasks.push({
        id,
        title: 'New scheduled task',
        day,
        start,
        duration,
        rpm: '',
        color: 'none',
        must: false,
        priority: state.tasks.length + 1,
        notes: '',
        complete: false
      });
      state.selectedTask = id;
      state.taskSheetOpen = true;
      render();
    }

    document.addEventListener('click', event => {
      const closedCapture = state.captureOpen && !event.target.closest('.capture, [data-action="capture"]');
      if (closedCapture) state.captureOpen = false;

      const interactiveInTimeline = event.target.closest(
        '[data-task], [data-action], button, .gap-add, .task-complete, .resize-handle, .timeline-gap'
      );
      const emptyTimeline = event.target.closest('.timeline');
      if (emptyTimeline && !interactiveInTimeline) {
        const rect = emptyTimeline.getBoundingClientRect();
        const start = Math.max(
          DAY_START,
          Math.min(1425, DAY_START + Math.round(((event.clientY - rect.top) / TODAY_HOUR_H * 60) / 15) * 15)
        );
        createScheduledTask(Number(emptyTimeline.dataset.timeline), start);
        return;
      }

      const target = event.target.closest('button, [data-action], [data-task], [data-project], .agenda-row');
      if (!target) {
        if (closedCapture) render();
        return;
      }

      if (target.dataset.view) {
        state.view = target.dataset.view;
        state.captureOpen = false;
        state.taskSheetOpen = false;
        state.projectOpen = null;
        window.scrollTo(0, 0);
        render();
        return;
      }
      if (target.dataset.day != null) {
        state.selectedDay = Number(target.dataset.day);
        state.unscheduledOpen = false;
        render();
        return;
      }

      const action = target.dataset.action;
      if (action === 'toggle-complete') {
        event.stopPropagation();
        const t = state.tasks.find(x => x.id === Number(target.dataset.id));
        if (t) {
          t.complete = !t.complete;
          toast(t.complete ? 'Task completed' : 'Task reopened');
        }
        return;
      }
      if (action === 'add-at') {
        event.stopPropagation();
        const day = Number(target.dataset.day);
        const start = Number(target.dataset.start);
        createScheduledTask(day, start);
        return;
      }

      if (target.dataset.task) {
        openTask(target.dataset.task);
        return;
      }
      if (target.dataset.project) {
        state.projectOpen = target.dataset.project;
        window.scrollTo(0, 0);
        render();
        return;
      }
      if (target.dataset.rpmFilter) {
        state.rpmFilter = target.dataset.rpmFilter;
        render();
        return;
      }
      if (target.dataset.projectFilter) {
        state.projectFilter = target.dataset.projectFilter;
        render();
        return;
      }

      if (!action) {
        if (closedCapture) render();
        return;
      }
      if (action === 'capture') { state.captureOpen = true; render(); }
      if (action === 'capture-done') { state.captureOpen = false; render(); }
      if (action === 'toggle-unscheduled') { state.unscheduledOpen = !state.unscheduledOpen; render(); }
      if (action === 'close-sheet') { state.taskSheetOpen = false; render(); }
      if (action === 'project-back') { state.projectOpen = null; render(); }
      if (action === 'toggle-rpm') {
        const updateRpm = () => {
          state.rpmOpen = state.rpmOpen === target.dataset.id ? null : target.dataset.id;
          render();
        };
        if (document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.startViewTransition(updateRpm);
        } else {
          updateRpm();
        }
      }
      if (action === 'rpm-select-mode') {
        state.rpmSelecting = !state.rpmSelecting;
        state.selectedRpmTasks = [];
        render();
      }
      if (action === 'select-rpm-task') {
        const id = target.dataset.id;
        state.selectedRpmTasks = state.selectedRpmTasks.includes(id)
          ? state.selectedRpmTasks.filter(x => x !== id)
          : [...state.selectedRpmTasks, id];
        render();
      }
      if (action === 'complete-rpm-task') {
        const t = state.rpmTasks.find(x => x.id === target.dataset.id);
        if (t) t.complete = !t.complete;
        render();
      }
      if (action === 'schedule-selection' && state.selectedRpmTasks.length) {
        state.scheduleOpen = true;
        render();
      }
      if (action === 'close-schedule') { state.scheduleOpen = false; render(); }
      if (action === 'confirm-schedule') { confirmSchedule(); }
      if (action === 'save-task') { saveTask(); }
      if (action === 'delete-task') {
        state.tasks = state.tasks.filter(t => t.id !== state.selectedTask);
        state.taskSheetOpen = false;
        state.selectedTask = null;
        toast('Task deleted');
      }
      if (action === 'new-project') toast('Prototype: new project flow starts here.');
      if (action === 'new-block') toast('Prototype: new RPM block flow starts here.');
      if (action === 'add-rpm-task') { state.captureOpen = true; render(); }
      if (action === 'toast-unassigned') toast('Unassigned tasks would open here.');
      if (action === 'toast-block') toast('This block is collapsed in the prototype.');
      if (action === 'project-schedule') toast('Select project tasks, then place them in Week or Today.');
      if (action === 'calendar') toast('Choose another date from the date strip.');
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.id === 'capture-input') {
        event.preventDefault();
        captureTask();
      }
      if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.task-card[data-task], .agenda-row[data-task]')) {
        event.preventDefault();
        openTask(event.target.dataset.task);
      }
      if (event.key === 'Enter' && event.target.matches('.timeline')) {
        event.preventDefault();
        const id = Date.now();
        const day = Number(event.target.dataset.timeline);
        state.tasks.push({
          id,
          title: 'New scheduled task',
          day,
          start: 540,
          duration: 30,
          rpm: '',
          color: 'none',
          must: false,
          priority: state.tasks.length + 1,
          notes: '',
          complete: false
        });
        state.selectedTask = id;
        state.taskSheetOpen = true;
        render();
      }
      if (event.key === 'Escape') {
        state.captureOpen = false;
        state.taskSheetOpen = false;
        state.scheduleOpen = false;
        render();
      }
    });

    let gesture = null;
    document.addEventListener('pointerdown', event => {
      if (event.target.closest('.task-complete, .gap-add, [data-action="toggle-complete"], [data-action="add-at"]')) {
        return;
      }
      const card = event.target.closest('.task-card');
      if (!card) return;
      const id = Number(card.dataset.task);
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      const resize = Boolean(event.target.closest('[data-resize]'));
      gesture = {
        id,
        startY: event.clientY,
        originalStart: task.start,
        originalDuration: task.duration,
        resize,
        ready: resize,
        moved: false
      };
      if (!resize) {
        gesture.timer = setTimeout(() => {
          if (gesture?.id === id) gesture.ready = true;
        }, 180);
      }
      card.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    document.addEventListener('pointermove', event => {
      if (!gesture || !gesture.ready) return;
      const dy = event.clientY - gesture.startY;
      if (Math.abs(dy) < 5) return;
      gesture.moved = true;
      const delta = Math.round((dy / TODAY_HOUR_H * 60) / 15) * 15;
      const task = state.tasks.find(t => t.id === gesture.id);
      if (!task) return;
      if (gesture.resize) {
        task.duration = Math.max(15, Math.min(360, gesture.originalDuration + delta));
      } else {
        task.start = Math.max(DAY_START, Math.min(1425, gesture.originalStart + delta));
      }
      render();
    });

    document.addEventListener('pointerup', () => {
      if (!gesture) return;
      clearTimeout(gesture.timer);
      const wasMoved = gesture.moved;
      const id = gesture.id;
      gesture = null;
      if (wasMoved) {
        state.selectedTask = id;
        toast('Time updated in 15-minute steps');
      } else {
        openTask(id);
      }
    });

    render();
  </script>
</body>
</html>
