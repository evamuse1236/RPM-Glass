<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>RPM · Capture</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/night.css"><script type="module" src="/runtime.js"></script></head>
<body><main><section id="panel" class="panel capture-root" aria-label="RPM Capture" data-cap-state="idle" data-composer="stacked">
<div class="cap-shell" aria-hidden="true"><div class="cap-aurora"><i></i><i></i><i></i></div></div>
<article class="assistant-card"><header class="panel-header"><button id="home" class="identity" aria-label="Return to Capture"><span class="status-dot" aria-hidden="true"></span><span id="view-label">RPM</span></button><button id="expand" class="info-button" aria-label="Expand conversation" aria-pressed="false"><span hidden>Expand</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button><button id="close" class="info-button" aria-label="Close Capture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
<div id="content" class="content" tabindex="0" aria-label="Conversation and records"><p class="empty">Opening your conversation…</p></div><button id="capture-overflow" type="button" hidden aria-label="Scroll down to see more of this response">More below ↓</button><div id="capture-actions" aria-label="Response actions"></div><div id="status" class="status" role="status" aria-live="polite"></div></article>
<footer class="composer-area"><p id="listening" role="status" hidden>Listening…</p><div id="prompt-choices" aria-label="Suggested replies"></div><form id="composer"><label class="sr-only" for="message">Message RPM</label><textarea id="message" rows="1" maxlength="12000" placeholder="Capture a thought…"></textarea><div class="composer-controls"><button id="menu-toggle" class="more-button" type="button" aria-label="More: planner, history, settings" aria-haspopup="menu" aria-expanded="false" aria-controls="quick-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>More</span></button><span class="composer-spacer"></span><button id="dictate" class="info-button" type="button" aria-label="Voice input"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0V5ZM5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><button id="send" class="send" type="submit" aria-label="Send" aria-describedby="hold-hint" aria-haspopup="menu" aria-expanded="false" aria-controls="quick-menu"><svg class="hold-ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></form><span id="hold-hint" class="sr-only">Hold for planner and more.</span></footer>
<nav id="quick-menu" class="quick-menu" aria-label="Capture options" role="menu" hidden inert><div class="menu-heading"><span>Capture options</span><button id="menu-dismiss" class="info-button" tabindex="-1" aria-label="Close options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="menu-items">
<button id="about" role="menuitem" tabindex="-1"><span>About</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v6m0-10v.1"/></svg></button>
<button id="settings" role="menuitem" tabindex="-1"><span>Assistant settings</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
<button id="context-view" role="menuitem" tabindex="-1" aria-pressed="false"><span>Context</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6l2 2 2-2h6v15h-6l-2 2-2-2H4Zm8 3v11"/></svg></button>
<button id="history-view" role="menuitem" tabindex="-1" aria-pressed="false"><span>History</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a8 8 0 1 1 0 8M4 3v5h5m3 0v5l3 2"/></svg></button></div>
<button id="plans-view" class="planner-route" role="menuitem" tabindex="-1" aria-pressed="false"><span>Open planner<small id="planner-draft-note" hidden>Your draft is kept</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4m8-4v4M4 10h16m-11 4h2m2 0h2"/></svg></button></nav>
<button hidden id="chat-view" aria-pressed="true">Capture</button></section><button id="launcher" aria-label="Open RPM assistant" hidden>Open RPM</button></main></body></html>
