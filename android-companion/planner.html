<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RPM Planner</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/planner.css">
  <link rel="stylesheet" href="/review.css">
  <script type="module" src="/runtime.js"></script>
</head>
<body>
  <main id="planner" data-view="today">
    <header id="top-bar" class="top-bar"></header>
    <div id="planner-scroll">
      <section id="workspace" aria-label="Plan">
        <div class="page" aria-busy="true">
          <p class="skeleton" role="status">Loading your plan…</p>
          <div class="skeleton" aria-hidden="true"></div>
          <div class="skeleton" aria-hidden="true"></div>
        </div>
      </section>
    </div>
    <div id="fab-host"></div>
    <nav id="nav-bar" aria-label="Planning"></nav>
  </main>
  <section id="sheet" hidden role="dialog" aria-modal="true" aria-label="Edit plan"></section>
  <div id="snackbar" role="status" aria-live="polite" hidden></div>
</body>
</html>
