<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Clean-sheet Plan Ribbon prototype. Current prototype intentionally left unchanged.
  -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%224%22 fill=%22%233A5F8A%22/><path d=%22M4 12h16M8 8v8M16 8v8%22 stroke=%22white%22 stroke-width=%221.6%22 fill=%22none%22/></svg>">
  <title>RPM Plan Ribbon</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #F4F6F8;
      --surface: #FFFFFF;
      --ink: #1B2430;
      --steel: #3A5F8A;
      --steel-strong: #2E4D70;
      --open: #B8D4CE;
      --open-soft: color-mix(in srgb, #B8D4CE 42%, #FFFFFF);
      --signal: #C9842F;
      --brand-accent: #A95755;
      --brand-accent-soft: #F8E8E6;
      --brand-accent-ink: #873C3A;
      --divider: #E2E7ED;
      --mute: #5C6B7A;
      --soft: #E8ECF1;
      --edge-launch: #3A5F8A;
      --edge-deep: #3D7A74;
      --edge-life: #8A6B2E;
      --edge-none: #7A8794;
      --fill-launch: color-mix(in srgb, #3A5F8A 12%, #FFFFFF);
      --fill-deep: color-mix(in srgb, #3D7A74 14%, #FFFFFF);
      --fill-life: color-mix(in srgb, #C9842F 12%, #FFFFFF);
      --fill-none: color-mix(in srgb, #7A8794 10%, #FFFFFF);
      --nav-h: 64px;
      --hour-h: 64px;
      --ribbon-day-w: 128px;
      --ribbon-track-h: 72px;
      --radius: 14px;
      --radius-sm: 10px;
      --font: "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "Roboto Mono", ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --shadow: 0 1px 2px rgba(27, 36, 48, .04), 0 6px 18px rgba(27, 36, 48, .05);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #d8dde3;
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    strong, b { font-weight: 600; }
    svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    :focus-visible {
      outline: 2px solid var(--steel);
      outline-offset: 2px;
    }

    .phone {
      width: min(100%, 430px);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--canvas);
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 0 1px rgba(27, 36, 48, .06);
    }
    .app {
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
    }
    @keyframes view-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: none; }
    }
    .app > .content,
    .app > section.content {
      animation: view-in .22s var(--ease);
    }

    /* —— App bar —— */
    .appbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 12px 16px 6px;
      background: color-mix(in srgb, var(--canvas) 90%, transparent);
      backdrop-filter: blur(14px);
    }
    .appbar-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .appbar h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.4px;
      font-weight: 500;
      flex: 1;
    }
    .appbar .subtitle {
      display: block;
      margin-top: 2px;
      color: var(--mute);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.02px;
    }
    .icon-button, .back-button {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none;
    }
    .icon-button:hover, .back-button:hover { background: var(--soft); }
    .text-button, .tonal-button, .chip, .segment button {
      min-height: 40px;
      border: 0;
      border-radius: 999px;
      padding: 0 14px;
      font-weight: 500;
      letter-spacing: 0.1px;
      background: var(--soft);
      cursor: pointer;
      transition: background .15s var(--ease), color .15s var(--ease);
    }
    .tonal-button {
      color: var(--steel-strong);
      background: color-mix(in srgb, var(--steel) 14%, var(--surface));
    }
    .text-button {
      background: transparent;
      color: var(--steel-strong);
    }
    .content { padding: 2px 16px 28px; }
    .content.content-today {
      padding: 0 12px 28px;
    }

    /* —— Today date heading —— */
    .today-appbar {
      padding: 14px 16px 2px;
      background: transparent;
      backdrop-filter: none;
    }
    .today-appbar .appbar-row { min-height: 44px; align-items: flex-start; }
    .today-heading {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.6px;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 2px;
      flex-wrap: wrap;
    }
    .today-heading .year {
      color: color-mix(in srgb, var(--steel) 55%, var(--mute));
      font-weight: 500;
    }
    .today-heading .chev {
      display: inline-grid;
      place-items: center;
      color: var(--mute);
      margin-left: 2px;
      transform: translateY(1px);
    }
    .today-heading .chev svg {
      width: 18px;
      height: 18px;
      transform: rotate(-90deg);
    }

    /* —— Date chips (Today) —— */
    .date-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      margin: 6px 4px 14px;
      padding: 2px 0 4px;
    }
    .date-button {
      min-width: 0;
      min-height: 64px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      display: grid;
      place-content: start center;
      gap: 6px;
      padding: 4px 0 2px;
      cursor: pointer;
      color: var(--ink);
    }
    .date-button .dow {
      font-size: 11px;
      color: var(--mute);
      font-weight: 400;
      letter-spacing: 0.1px;
      text-transform: none;
    }
    .date-button .date {
      width: 34px;
      height: 34px;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      line-height: 1;
      transition: background .15s var(--ease), color .15s var(--ease);
    }
    .date-button.selected .dow {
      color: var(--ink);
      font-weight: 500;
    }
    .date-button.selected .date {
      background: var(--ink);
      color: #fff;
      font-weight: 600;
    }
    /* —— Unscheduled tray —— */
    .tray {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--divider);
      border-radius: 14px;
      background: var(--surface);
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(27, 36, 48, .03);
    }
    .tray .label { flex: 1; }
    .tray .count {
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 99px;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: var(--steel-strong);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
    }
    .tray .chev {
      color: var(--mute);
      display: grid;
      transition: transform .18s var(--ease);
    }
    .tray .chev svg { width: 18px; height: 18px; }
    .tray[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .tray-list {
      margin: 8px 0 12px;
      display: grid;
      gap: 6px;
    }
    .tray-item {
      min-height: 48px;
      border: 1px solid var(--divider);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }
    .tray-item .rail {
      width: 3px;
      height: 22px;
      border-radius: 99px;
      background: var(--edge-none);
      flex: none;
    }
    .tray-item .rail.edge-launch { background: var(--edge-launch); }
    .tray-item .rail.edge-deep { background: var(--edge-deep); }
    .tray-item .rail.edge-life { background: var(--edge-life); }
    .tray-item b { font-weight: 500; flex: 1; }
    .tray-item small {
      font-family: var(--mono);
      color: var(--mute);
      font-size: 12px;
    }
    .empty {
      padding: 16px 8px;
      color: var(--mute);
      font-size: 13.5px;
      text-align: center;
    }

    /* —— Today milestone timeline —— */
    .timeline-wrap {
      margin-top: 12px;
      border-radius: 28px;
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--divider) 80%, transparent);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 1px 2px rgba(27, 36, 48, .03),
        0 10px 28px rgba(27, 36, 48, .05);
    }
    .timeline-handle {
      width: 36px;
      height: 4px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--mute) 22%, var(--soft));
      margin: 10px auto 4px;
      flex: none;
    }
    .timeline {
      --hour-h: 64px;
      --rail-w: 44px;
      --node-w: 48px;
      height: calc(17 * var(--hour-h));
      position: relative;
      margin: 4px 8px 12px 0;
      margin-left: var(--rail-w);
      touch-action: pan-y;
    }
    .timeline-spine {
      position: absolute;
      left: calc(var(--node-w) / 2 - 1px);
      top: 8px;
      bottom: 12px;
      width: 0;
      border-left: 2px dotted color-mix(in srgb, var(--mute) 28%, var(--divider));
      z-index: 1;
      pointer-events: none;
    }
    .hour-row {
      position: absolute;
      left: calc(-1 * var(--rail-w));
      right: 0;
      height: var(--hour-h);
      pointer-events: none;
      z-index: 0;
    }
    .hour-row span {
      position: absolute;
      left: 0;
      top: -6px;
      width: calc(var(--rail-w) - 4px);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 400;
      color: color-mix(in srgb, var(--mute) 88%, var(--ink));
      text-align: right;
      padding-right: 4px;
    }
    /* Subtle rail-only “now” cue — no full-width rule across task content */
    .current-line {
      position: absolute;
      left: calc(var(--node-w) / 2 - 4px);
      width: 8px;
      height: 8px;
      right: auto;
      border-radius: 50%;
      z-index: 6;
      pointer-events: none;
      background: var(--steel);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--steel) 14%, #fff);
    }
    .current-line::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 3px;
      width: 11px;
      height: 2px;
      border-radius: 2px;
      background: color-mix(in srgb, var(--steel) 48%, transparent);
    }

    .timeline-gap {
      position: absolute;
      left: calc(var(--node-w) + 6px);
      right: 10px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      padding: 4px 0;
      pointer-events: none;
      overflow: hidden;
    }
    .gap-msg {
      display: flex;
      align-items: center;
      gap: 6px;
      color: color-mix(in srgb, var(--mute) 92%, var(--ink));
      font-size: 12.5px;
      line-height: 1.35;
      max-width: 100%;
    }
    .gap-msg .gap-icon {
      flex: none;
      color: color-mix(in srgb, var(--mute) 80%, var(--steel));
      display: grid;
    }
    .gap-msg .gap-icon svg { width: 14px; height: 14px; }
    .gap-msg strong {
      color: var(--steel-strong);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .gap-add {
      pointer-events: auto;
      min-height: 32px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: color-mix(in srgb, var(--steel) 10%, var(--soft));
      color: var(--steel-strong);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .gap-add:hover {
      background: color-mix(in srgb, var(--steel) 16%, var(--soft));
    }
    .gap-add svg { width: 14px; height: 14px; }

    .task-card {
      position: absolute;
      z-index: 8;
      left: 0;
      right: 4px;
      min-height: 48px;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      overflow: visible;
      cursor: grab;
      touch-action: none;
      user-select: none;
      display: grid;
      grid-template-columns: var(--node-w) minmax(0, 1fr) 36px;
      gap: 8px;
      align-items: start;
    }
    /*
      Concurrent tasks (compact conflict):
      — Both nodes stay on the vertical rail (staggered by start time).
      — Bodies split into left/right columns so text and complete controls never collide.
    */
    .task-card.is-conflict {
      display: block;
      min-height: 44px;
      left: 0;
      right: 4px;
    }
    .task-card.is-conflict .task-node {
      position: absolute;
      left: calc((var(--node-w) - 34px) / 2);
      top: 4px;
      width: 34px;
      height: 34px;
      min-height: 34px;
      border-radius: 50%;
      z-index: 2;
    }
    .task-card.is-conflict .task-node svg {
      width: 15px;
      height: 15px;
    }
    .task-card.is-conflict .task-body {
      position: absolute;
      top: 2px;
      padding: 2px 0;
      min-width: 0;
    }
    .task-card.is-conflict .task-meta {
      font-size: 10px;
    }
    .task-card.is-conflict .task-title {
      font-size: 13px;
      line-height: 1.2;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .task-card.is-conflict .task-complete {
      position: absolute;
      top: 6px;
      width: 24px;
      height: 24px;
      margin: 0;
    }
    .task-card.is-conflict .task-complete svg { width: 12px; height: 12px; }
    .task-card.is-conflict.lane-left {
      z-index: 9;
    }
    .task-card.is-conflict.lane-left .task-body {
      left: var(--node-w);
      width: calc(50% - var(--node-w) - 30px);
    }
    .task-card.is-conflict.lane-left .task-complete {
      left: calc(50% - 28px);
    }
    .task-card.is-conflict.lane-right {
      z-index: 10;
    }
    .task-card.is-conflict.lane-right .task-body {
      left: calc(50% + 2px);
      width: calc(50% - 34px);
    }
    .task-card.is-conflict.lane-right .task-complete {
      right: 2px;
    }
    /* Non-conflict legacy lanes (week ribbon shares class names on segs only) */
    .task-card.lane-left:not(.is-conflict) { right: 46%; }
    .task-card.lane-right:not(.is-conflict) {
      left: calc(var(--node-w) * 0.45);
      grid-template-columns: calc(var(--node-w) * 0.85) minmax(0, 1fr) 36px;
    }
    .task-card.edge-launch,
    .task-card.edge-deep,
    .task-card.edge-life,
    .task-card.edge-none {
      background: transparent;
      border-left-color: transparent;
    }
    .task-card.selected {
      outline: none;
      z-index: 12;
      overflow: visible;
    }
    .task-card.selected .task-body {
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--steel) 55%, transparent);
      background: color-mix(in srgb, var(--steel) 6%, var(--surface));
    }
    .task-card.complete { opacity: 1; }
    .task-card.complete .task-title {
      text-decoration: line-through;
      color: var(--mute);
    }
    .task-card.complete .task-node {
      opacity: .72;
    }

    .task-node {
      position: relative;
      z-index: 2;
      width: var(--node-w);
      height: 100%;
      min-height: 48px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--soft) 70%, #fff);
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--divider) 90%, transparent),
        0 1px 2px rgba(27, 36, 48, .04);
      color: var(--mute);
      pointer-events: none;
    }
    .task-node svg { width: 22px; height: 22px; }
    .task-card.edge-launch .task-node {
      color: var(--edge-launch);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--edge-launch) 10%, #fff), color-mix(in srgb, var(--soft) 55%, #fff));
    }
    .task-card.edge-deep .task-node {
      color: var(--edge-deep);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--edge-deep) 12%, #fff), color-mix(in srgb, var(--soft) 55%, #fff));
    }
    .task-card.edge-life .task-node {
      color: var(--edge-life);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--signal) 14%, #fff), color-mix(in srgb, var(--soft) 55%, #fff));
    }
    .task-card.edge-none .task-node {
      color: var(--edge-none);
    }
    .task-card.tall-node .task-node {
      border-radius: 22px;
    }

    .task-body {
      min-width: 0;
      padding: 6px 4px 4px 0;
      border-radius: 12px;
      transition: box-shadow .15s var(--ease), background .15s var(--ease);
    }
    .task-meta {
      margin: 0 0 2px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--mute);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .task-meta .must-mark {
      color: var(--signal);
      font-size: 11px;
      line-height: 1;
    }
    .task-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.15px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink);
    }
    .task-complete {
      width: 28px;
      height: 28px;
      margin-top: 8px;
      margin-right: 2px;
      border: 1.5px solid color-mix(in srgb, var(--mute) 42%, var(--divider));
      border-radius: 50%;
      background: transparent;
      color: var(--steel-strong);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none;
      padding: 0;
      font-size: 13px;
      line-height: 1;
      justify-self: end;
    }
    .task-complete:hover {
      border-color: var(--steel);
      background: color-mix(in srgb, var(--steel) 8%, #fff);
    }
    .task-complete.is-done {
      background: color-mix(in srgb, var(--steel) 14%, #fff);
      border-color: var(--steel);
      color: var(--steel-strong);
      font-weight: 600;
    }
    .task-complete svg { width: 14px; height: 14px; }

    .resize-handle {
      display: none;
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 72px;
      height: 44px;
      transform: translateX(-50%);
      border: 0;
      background: transparent;
      cursor: ns-resize;
      z-index: 4;
    }
    .resize-handle::after {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      top: 18px;
      height: 4px;
      border-radius: 99px;
      background: var(--steel);
      box-shadow: 0 0 0 3px var(--surface);
    }
    .task-card.selected .resize-handle { display: block; }

    /* —— RPM segment rail —— */
    .section-label {
      margin: 18px 2px 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.55px;
      color: var(--mute);
      text-transform: uppercase;
    }
    .block-list { display: grid; gap: 10px; }
    .block {
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }
    .block.open {
      box-shadow: var(--shadow);
      border-color: color-mix(in srgb, var(--steel) 22%, var(--divider));
    }
    .block-stub {
      width: 100%;
      min-height: 52px;
      padding: 12px 12px 12px 0;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 0;
      text-align: left;
      cursor: pointer;
    }
    .seg-rail {
      width: 4px;
      align-self: stretch;
      min-height: 28px;
      margin: 0 12px 0 0;
      border-radius: 0 3px 3px 0;
      background: var(--edge-launch);
      flex: none;
    }
    .seg-rail.deep { background: var(--edge-deep); }
    .seg-rail.life { background: var(--edge-life); }
    .block-stub-copy { flex: 1; min-width: 0; }
    .block-stub-copy strong {
      display: block;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.1px;
    }
    .block-stub-copy small {
      display: block;
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--mute);
    }
    .block-body { padding: 0 14px 14px 16px; }
    .rp-stack { margin: 0 0 10px; }
    .rp-result {
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: -0.15px;
      line-height: 1.3;
      margin: 0 0 4px;
    }
    .rp-purpose {
      margin: 0;
      font-size: 13px;
      color: var(--mute);
      line-height: 1.4;
    }
    .rp-purpose b {
      font-weight: 500;
      color: var(--mute);
      margin-right: 4px;
    }
    .meta-line {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--mute);
      margin: 0 0 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--divider);
    }
    .segment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 3px;
      border-radius: 999px;
      background: var(--soft);
      margin-bottom: 10px;
    }
    .segment button {
      min-height: 36px;
      border-radius: 999px;
      background: transparent;
      color: var(--mute);
      font-weight: 500;
    }
    .segment button.selected {
      background: var(--steel);
      color: #fff;
    }
    .rpm-task-list { display: grid; gap: 2px; }
    .rpm-task {
      min-height: 48px;
      display: grid;
      grid-template-columns: 40px 22px 22px 1fr auto;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--divider) 70%, transparent);
    }
    .rpm-task:last-child { border-bottom: 0; }
    .rpm-task.done .rpm-title {
      text-decoration: line-through;
      color: var(--mute);
    }
    .check-button {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      border-radius: 50%;
    }
    .check-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, var(--steel) 45%, var(--divider));
      display: grid;
      place-items: center;
      font-size: 12px;
      color: var(--steel-strong);
      background: var(--surface);
    }
    .rpm-task.done .check-circle,
    .check-circle.selected {
      background: var(--steel);
      border-color: var(--steel);
      color: #fff;
    }
    .rpm-task .must {
      text-align: center;
      color: var(--signal);
      font-size: 13px;
    }
    .rpm-task .priority {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--mute);
      text-align: center;
    }
    .rpm-title {
      font-size: 14px;
      font-weight: 400;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rpm-task .duration {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--mute);
      padding-right: 2px;
    }
    .block-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .block-actions .tonal-button { width: 100%; }
    .selection-bar {
      position: sticky;
      bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));
      z-index: 20;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
    }
    .selection-bar b {
      flex: 1;
      font-weight: 500;
      font-size: 13.5px;
      font-family: var(--mono);
    }
    .selection-bar button {
      min-height: 40px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      background: var(--open);
      color: var(--ink);
      font-weight: 600;
      cursor: pointer;
    }
    .selection-bar button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* —— Projects lattice cards —— */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .chip {
      color: var(--mute);
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--divider);
    }
    .chip.selected {
      background: var(--steel);
      color: #fff;
      box-shadow: none;
    }
    .project-list { display: grid; gap: 12px; }
    .project-card {
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(27, 36, 48, .03);
    }
    .project-top {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 14px 14px 0;
      text-align: left;
      cursor: pointer;
    }
    .project-title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .project-title-row strong {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.15px;
      min-width: 0;
    }
    .days-left {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--mute);
      flex: none;
    }
    .days-left.pressure { color: var(--signal); }
    .deadline-sub {
      margin-top: 3px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--mute);
    }
    .lattice {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      margin: 12px 0 0;
      border-top: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
    }
    .lattice-cell {
      padding: 10px 8px;
      text-align: center;
      min-width: 0;
    }
    .lattice-cell + .lattice-cell {
      border-left: 1px solid var(--divider);
    }
    .lattice-cell b {
      display: block;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.1px;
    }
    .lattice-cell span {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: var(--mute);
    }
    .edge-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px 0;
    }
    .edge-track {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: var(--divider);
      overflow: hidden;
    }
    .edge-track > span {
      display: block;
      height: 100%;
      background: var(--steel);
      border-radius: inherit;
    }
    .edge-pct {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--mute);
      flex: none;
    }
    .next-row {
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      padding: 10px 14px 12px;
      border: 0;
      border-top: 1px solid var(--divider);
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      cursor: pointer;
    }
    .next-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, var(--steel) 40%, var(--divider));
      flex: none;
    }
    .next-copy {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
    }
    .next-copy small {
      display: block;
      font-size: 11px;
      color: var(--mute);
      margin-bottom: 1px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .next-copy b {
      font-weight: 500;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Project detail */
    .detail-card {
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px;
    }
    .detail-card h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }
    .detail-card > p {
      margin: 0 0 12px;
      color: var(--mute);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }
    .detail-stat {
      border: 1px solid var(--divider);
      border-radius: 10px;
      padding: 10px;
    }
    .detail-stat small {
      display: block;
      color: var(--mute);
      font-size: 11px;
      margin-bottom: 2px;
    }
    .detail-stat strong {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 500;
    }

    /* —— Week ribbon (hero) —— */
    .ribbon-shell {
      margin: 4px -16px 12px;
      padding: 0 0 2px;
    }
    .ribbon-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      padding: 0 16px 4px;
      scrollbar-width: thin;
    }
    .ribbon-track {
      display: flex;
      width: calc(7 * var(--ribbon-day-w));
      min-width: calc(7 * var(--ribbon-day-w));
      gap: 0;
    }
    .day-band {
      width: var(--ribbon-day-w);
      flex: none;
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      scroll-snap-align: start;
      position: relative;
    }
    .day-band + .day-band .band-body {
      border-left: 1px solid var(--divider);
    }
    .band-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 8px 6px;
      min-height: 28px;
    }
    .band-label .dow {
      font-size: 12px;
      font-weight: 500;
      color: var(--mute);
    }
    .band-label .num {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
    }
    .day-band.selected .band-label .dow,
    .day-band.selected .band-label .num {
      color: var(--steel-strong);
      font-weight: 600;
    }
    .band-body {
      height: var(--ribbon-track-h);
      margin: 0 4px;
      border-radius: 8px;
      background:
        linear-gradient(180deg, var(--open-soft), color-mix(in srgb, var(--open) 28%, var(--surface)));
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--open) 35%, var(--divider));
    }
    .day-band.selected .band-body {
      box-shadow:
        inset 0 0 0 1.5px var(--steel),
        0 0 0 1px color-mix(in srgb, var(--steel) 18%, transparent);
    }
    .day-band.selected .band-label {
      border-bottom: 2px solid var(--steel);
      margin: 0 4px 4px;
      padding-left: 4px;
      padding-right: 4px;
    }
    .day-band.over .band-body {
      background:
        repeating-linear-gradient(
          -45deg,
          color-mix(in srgb, var(--signal) 10%, var(--surface)),
          color-mix(in srgb, var(--signal) 10%, var(--surface)) 4px,
          color-mix(in srgb, var(--signal) 18%, var(--surface)) 4px,
          color-mix(in srgb, var(--signal) 18%, var(--surface)) 8px
        );
    }
    .ribbon-seg {
      position: absolute;
      left: 4px;
      right: 4px;
      border-radius: 4px;
      border-left: 2px solid var(--edge-none);
      background: color-mix(in srgb, var(--steel) 72%, #fff);
      min-height: 3px;
      opacity: .92;
      pointer-events: none;
    }
    .ribbon-seg.edge-launch {
      border-left-color: var(--edge-launch);
      background: color-mix(in srgb, var(--steel) 78%, #fff);
    }
    .ribbon-seg.edge-deep {
      border-left-color: var(--edge-deep);
      background: color-mix(in srgb, var(--edge-deep) 70%, #fff);
    }
    .ribbon-seg.edge-life {
      border-left-color: var(--edge-life);
      background: color-mix(in srgb, var(--edge-life) 65%, #fff);
    }
    .ribbon-seg.lane-left { right: 52%; }
    .ribbon-seg.lane-right { left: 52%; }
    .band-caption {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      padding: 6px 8px 0;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--mute);
      min-height: 22px;
    }
    .day-band.selected .band-caption { color: var(--steel-strong); }
    .day-band.over .band-caption .warn {
      color: var(--signal);
      font-weight: 600;
    }

    .agenda-list { display: grid; gap: 8px; margin-top: 4px; }
    .agenda-heading {
      margin: 14px 0 8px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.1px;
    }
    .agenda-row {
      min-height: 56px;
      border: 1px solid var(--divider);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 10px;
      align-items: center;
      cursor: pointer;
    }
    .agenda-row.complete { opacity: .55; }
    .agenda-row.complete .agenda-copy strong { text-decoration: line-through; }
    .agenda-time {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--mute);
      line-height: 1.3;
    }
    .agenda-copy strong {
      display: block;
      font-size: 14px;
      font-weight: 500;
    }
    .agenda-copy small {
      display: block;
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--mute);
    }
    .agenda-icons {
      color: var(--signal);
      font-size: 13px;
      text-align: right;
    }

    /* —— Fixed Material bottom nav (not floating pill) —— */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 430px);
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border-top: 1px solid var(--divider);
      z-index: 40;
    }
    .nav-item {
      min-height: 48px;
      border: 0;
      background: transparent;
      color: var(--mute);
      display: grid;
      place-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15px;
      cursor: pointer;
      border-radius: 12px;
      padding: 4px 2px;
    }
    .nav-item .nav-icon {
      width: 36px;
      height: 24px;
      border-radius: 12px;
      display: grid;
      place-items: center;
    }
    .nav-item.selected {
      color: var(--steel-strong);
    }
    .nav-item.selected .nav-icon {
      background: color-mix(in srgb, var(--steel) 16%, var(--surface));
      color: var(--steel);
    }
    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.9;
    }

    /* —— FAB —— */
    .fab {
      position: fixed;
      right: max(16px, calc(50% - 215px + 16px));
      bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 16px;
      background: var(--steel);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 35;
      box-shadow: 0 3px 8px rgba(27, 36, 48, .16), 0 8px 20px rgba(58, 95, 138, .22);
    }
    .fab svg { width: 24px; height: 24px; }

    /* —— Capture —— */
    .capture {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));
      width: min(calc(100% - 24px), 400px);
      display: flex;
      gap: 8px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--divider);
      border-radius: 14px;
      box-shadow: var(--shadow);
      z-index: 45;
    }
    .capture input {
      flex: 1;
      min-height: 44px;
      border: 1px solid var(--divider);
      border-radius: 10px;
      padding: 0 12px;
      background: var(--canvas);
    }
    .capture button {
      min-height: 44px;
      min-width: 72px;
      border: 0;
      border-radius: 10px;
      background: var(--brand-accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    /* —— Sheets —— */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(27, 36, 48, .36);
      z-index: 50;
    }
    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 430px);
      max-height: min(90dvh, 760px);
      overflow: auto;
      background: #f8f7f8;
      border: 1px solid color-mix(in srgb, var(--brand-accent) 10%, var(--divider));
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
      padding: 8px 18px calc(20px + env(safe-area-inset-bottom));
      z-index: 55;
      box-shadow: 0 -14px 40px rgba(27, 36, 48, .16);
    }
    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--brand-accent) 20%, var(--divider));
      margin: 4px auto 14px;
    }
    .sheet h2 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.4px;
    }
    .task-sheet-heading {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .task-sheet-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--brand-accent-soft);
      color: var(--brand-accent-ink);
    }
    .task-sheet-icon svg {
      width: 25px;
      height: 25px;
    }
    .task-sheet-heading h2 {
      margin: 0;
    }
    .task-sheet-heading p {
      margin: 2px 0 0;
      color: var(--mute);
      font-size: 12px;
    }
    .task-sheet-close {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--divider);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: var(--mute);
      cursor: pointer;
    }
    .task-sheet-close svg {
      width: 18px;
      height: 18px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      color: color-mix(in srgb, var(--brand-accent-ink) 78%, var(--mute));
      margin-bottom: 6px;
      font-weight: 600;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid color-mix(in srgb, var(--brand-accent) 10%, var(--divider));
      border-radius: 14px;
      padding: 10px 13px;
      background: var(--surface);
      box-shadow: 0 3px 12px rgba(27, 36, 48, .035);
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: 0;
      border-color: color-mix(in srgb, var(--brand-accent) 60%, var(--divider));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-accent-soft) 76%, transparent);
    }
    .field textarea { min-height: 84px; resize: vertical; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .toggle-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 48px;
      margin-bottom: 8px;
      padding: 11px 13px;
      border: 1px solid color-mix(in srgb, var(--brand-accent) 8%, var(--divider));
      border-radius: 16px;
      background: var(--surface);
      cursor: pointer;
    }
    .toggle-row input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--brand-accent); }
    .sheet-actions {
      display: flex;
      gap: 10px;
      position: sticky;
      bottom: calc(-20px - env(safe-area-inset-bottom));
      margin: 10px -18px 0;
      padding: 12px 18px calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(248, 247, 248, .82), #f8f7f8 28%);
      z-index: 2;
    }
    .sheet-actions .delete {
      min-height: 50px;
      flex: 1;
      border: 1px solid color-mix(in srgb, var(--brand-accent) 18%, var(--divider));
      border-radius: 16px;
      background: var(--surface);
      color: var(--brand-accent-ink);
      font-weight: 600;
      cursor: pointer;
    }
    .sheet-actions .save {
      min-height: 50px;
      flex: 1.4;
      border: 0;
      border-radius: 16px;
      background: var(--brand-accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .schedule-list {
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--mute);
      line-height: 1.6;
      margin: 0 0 12px;
      padding: 10px 12px;
      background: var(--canvas);
      border-radius: 10px;
      border: 1px solid var(--divider);
    }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--nav-h) + 72px + env(safe-area-inset-bottom));
      max-width: min(360px, calc(100% - 32px));
      padding: 10px 14px;
      border-radius: 10px;

<body>

  <script>
    /* Clean-sheet Plan Ribbon prototype. Current prototype intentionally left unchanged. */

    const DAYS = [

    const RPM_BLOCKS = [

    function icon(name) {
      const paths = {
        calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
        target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',
        folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
        week: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M8 9v12M16 9v12"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        down: '<path d="m6 9 6 6 6-6"/>',

        moon: '<path d="M20 14.5A7.5 7.5 0 0 1 9.5 4 7.5 7.5 0 1 0 20 14.5z"/>',
        briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',
