<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>RPM · Night assistant</title><link rel="stylesheet" href="/night.css"><script type="module" src="/runtime.js"></script></head>
<body><main><section id="panel" class="panel" aria-label="RPM assistant">
<article class="assistant-card"><header class="panel-header"><button id="home" class="identity" aria-label="Return to conversation"><span class="status-dot" aria-hidden="true"></span><span id="view-label">Assistant</span></button><button id="menu-toggle" class="info-button" aria-label="Open options" aria-expanded="false" aria-controls="quick-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v6m0-10v.1"/></svg></button></header><div id="content" class="content" tabindex="0" aria-label="Conversation and records"><p class="empty">Opening your conversation…</p></div><div id="status" class="status" role="status" aria-live="polite"></div></article>
<footer class="composer-area"><div id="prompt-choices" aria-label="Suggested replies"></div><form id="composer"><svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4Z"/></svg><label class="sr-only" for="message">Message RPM</label><textarea id="message" rows="1" maxlength="12000" placeholder="Ask anything…"></textarea><button id="send" class="send" type="submit" aria-label="Send message; hold for options" aria-haspopup="true" aria-expanded="false" aria-controls="quick-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></form></footer>
<nav id="quick-menu" class="quick-menu" aria-label="Assistant options" hidden><div class="menu-heading"><span>Options</span><button id="menu-dismiss" aria-label="Close options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="menu-items">
<button id="chat-view" aria-pressed="true"><span>Chat</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H4l1.5-4A8 8 0 1 1 20 11Z"/></svg></button>
<button id="plans-view" aria-pressed="false"><span>Plans</span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4m8-4v4M4 10h16m-11 4h2m2 0h2"/></svg></button>
<button id="context-view" aria-pressed="false"><span>Context</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6l2 2 2-2h6v15h-6l-2 2-2-2H4Zm8 3v11"/></svg></button>
<button id="history-view" aria-pressed="false"><span>History</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a8 8 0 1 1 0 8M4 3v5h5m3 0v5l3 2"/></svg></button>
<button id="settings"><span>Settings</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
<button id="expand" aria-label="Expand conversation" aria-pressed="false"><span>Expand</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
<button id="about"><span>About</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v6m0-10v.1"/></svg></button>
<button id="close" aria-label="Minimize assistant"><span>Minimize</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
</div></nav></section><button id="launcher" aria-label="Open RPM assistant" hidden>Open RPM</button></main></body></html>
