<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RPM · Companion</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="stage-header"><strong>RPM</strong><span>Personal assistant · local prototype</span></header>
<main><div class="stage-note"><h1>A little room<br>to think out loud.</h1><p>Your plans and context,<br>one conversation away.</p></div>
<section id="panel" class="panel" aria-label="RPM assistant" hidden>
<header class="panel-header"><button id="home" class="brand" aria-label="Return to conversation"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg></span><span>RPM<small>Here with you</small></span></button><div class="window-controls"><button id="expand" class="icon-button" aria-label="Expand conversation" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button id="close" class="icon-button" aria-label="Minimize assistant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button></div></header>
<nav class="view-nav" aria-label="Assistant views"><button id="chat-view" aria-pressed="true">Chat</button><button id="plans-view" aria-pressed="false">Current plans</button><button id="context-view" aria-pressed="false">Context</button><button id="history-view" aria-pressed="false">History</button></nav>
<div id="content" class="content" tabindex="0" aria-label="Conversation and records"></div>
<footer class="composer-area"><div id="status" class="status" role="status" aria-live="polite"></div><form id="composer"><label class="sr-only" for="message">Message RPM</label><textarea id="message" rows="1" maxlength="12000" placeholder="Type something…"></textarea><button id="send" class="send" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 11 6-6 6 6M12 5v15"/></svg></button></form><div class="footnote"><span>Local test copy · alerts preview only</span><button id="about">About</button></div></footer>
</section>
<button id="launcher" class="launcher" aria-label="Open RPM assistant" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg><span>Let’s talk</span></button>
</main></body></html>
