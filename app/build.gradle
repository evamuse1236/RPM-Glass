plugins { id "com.android.application" }
def rpmLocalProperties = new Properties()
def rpmLocalFile = rootProject.file('local.properties')
if (rpmLocalFile.exists()) rpmLocalFile.withInputStream { rpmLocalProperties.load(it) }
def rpmDebugKeystore = rpmLocalProperties.getProperty('rpm.debugKeystore')
android {
    namespace "com.rpm.prototype"
    compileSdk 36
    defaultConfig {
        applicationId "com.rpm.prototype"
        minSdk 26
        targetSdk 36
        versionCode 33
        versionName "0.33-site-parity"
        testInstrumentationRunner "com.rpm.prototype.OfflineTests"
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/syncAssets"))
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (rpmDebugKeystore) {
        def originalKeystore = rootProject.file(rpmDebugKeystore)
        if (!originalKeystore.isFile()) throw new GradleException('Configured RPM signing keystore is missing.')
        signingConfigs {
            debug {
                storeFile originalKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}
dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "org.json:json:20240303"
}
tasks.register('bundleCompanion', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/build-companion-assets.mjs'
    inputs.files(fileTree('../android-companion'), fileTree('../chat-prototype'), fileTree('../cli'), fileTree('../intent-v2/src'), fileTree('../intent-v2/adapters'), fileTree('../intent-v2/prompts'), fileTree('../web/contract'), file('../scripts/build-companion-assets.mjs'))
    outputs.dir('src/main/assets/companion')
}
tasks.register('bundleSyncContract', Copy) {
    from rootProject.file('web/contract/records.json')
    into layout.buildDirectory.dir('generated/syncAssets/sync')
}
tasks.named('preBuild').configure { dependsOn 'bundleCompanion', 'bundleSyncContract' }

tasks.withType(Test).configureEach {
    inputs.files(rootProject.file('fixtures/habit-cases.json'), rootProject.file('fixtures/record-keys.json'), rootProject.file('web/fixtures/snapshot.json'), rootProject.file('web/contract/records.json'))
}
